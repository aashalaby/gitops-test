# Secrets never live in Git in plaintext. This connects the cluster to your
# external secret store; only *references* are committed.
#
# Pick the provider block that matches your cloud and delete the rest.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: default
  annotations:
    # Must come after the CRDs and webhook are ready.
    argocd.argoproj.io/sync-wave: "-35"
spec:
  provider:
    # --- AWS Secrets Manager (IRSA) ---
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

    # --- HashiCorp Vault ---
    # vault:
    #   server: https://vault.example.com
    #   path: secret
    #   version: v2
    #   auth:
    #     kubernetes:
    #       mountPath: kubernetes
    #       role: external-secrets

