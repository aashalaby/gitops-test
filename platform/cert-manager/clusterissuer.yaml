# Classic sync-wave problem: this is a custom resource whose CRD is installed
# by the chart above. Without the wave annotation the first sync fails with
# "no matches for kind ClusterIssuer" and you rely on retry to recover.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # TODO: your email
    email: platform@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: your email
    email: platform@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
