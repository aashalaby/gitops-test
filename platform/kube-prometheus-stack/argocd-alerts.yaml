# Argo CD's own health is the thing most likely to be forgotten. If the
# controller stops reconciling, nothing else alerts — the cluster simply
# stops tracking Git.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Application {{ $labels.name }} has been out of sync for 30m"

        - alert: ArgoCDAppUnhealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Application {{ $labels.name }} is {{ $labels.health_status }}"

        - alert: ArgoCDSyncFailing
          expr: |
            increase(argocd_app_sync_total{phase="Failed"}[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "Repeated sync failures for {{ $labels.name }}"

        - alert: ArgoCDControllerDown
          expr: |
            absent(up{job=~".*argocd-metrics.*"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD application controller is not reporting metrics"
